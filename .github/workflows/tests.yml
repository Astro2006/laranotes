name: Pull Request | Tests

on: pull_request

permissions:
  contents: read

jobs:
  pest:
    runs-on: ubuntu-latest
    name: pull-request | pest

    env:
      PHP_VERSION: 8.5
      NODE_VERSION: 22

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: dom, curl, fileinfo, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, intl
          coverage: none

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Add Flux license
        if: ${{ secrets.FLUXUI_USERNAME != '' && secrets.FLUXUI_LICENSE_KEY != '' }}
        run: composer config --auth http-basic.composer.fluxui.dev "${{ secrets.FLUXUI_USERNAME }}" "${{ secrets.FLUXUI_LICENSE_KEY }}"

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.composer/cache/files
            ~/.composer/cache/repo
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        run: composer install --no-progress --prefer-dist --no-interaction --optimize-autoloader

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Setup Node.js Environment
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci

      - name: Build Frontend Assets
        run: npm run build

      - name: Run Tests
        run: composer test

      - name: Store Log Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: ./storage/logs
